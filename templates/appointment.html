{% extends "base.html" %}{% block title %}Đặt lịch{% endblock %}
{% block content %}<div class="container py-5"><div class="card p-4 mx-auto" style="max-width:800px">
<h2>📅 Đặt lịch hẹn với Ban ấp Bình Châu</h2><p class="text-muted">Sau khi gửi, Ban ấp sẽ xem xét và xác nhận lịch.</p>
<form method="post">
<label class="required">Họ và tên</label><input class="form-control mb-3" name="name" required>
<label class="required">Số điện thoại</label><input class="form-control mb-3" name="phone" required>
<label>Địa chỉ</label><input class="form-control mb-3" name="address">
<div class="row"><div class="col-md-6"><label class="required">Ngày hẹn</label><input type="date" class="form-control mb-3" name="date" required></div>
<div class="col-md-6"><label class="required">Giờ hẹn</label><input type="time" class="form-control mb-3" name="time" required></div></div>
<label class="required">Nội dung làm việc</label><textarea class="form-control mb-3" name="purpose" rows="4" required></textarea>
<button class="btn btn-main btn-lg w-100">Gửi yêu cầu đặt lịch</button>
</form></div></div>{% endblock %}
